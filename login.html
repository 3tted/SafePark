<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — SafePark</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="form-page">
    <div class="form-box">

      <div class="form-logo">
        <div class="form-logo-placeholder">LOGO</div>
        <h1>Safe<span>Park</span></h1>
      </div>
      <p class="form-subtitle">Inicia sesión para explorar áreas verdes seguras</p>

      <form action="home.html">
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input class="form-input" type="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input class="form-input" type="password" placeholder="••••••••">
        </div>
        <button class="btn-primary" type="submit">Iniciar sesión</button>
      </form>

      <div class="form-footer">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>

    </div>
  </div>

</body>
</html>
