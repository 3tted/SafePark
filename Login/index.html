<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - SafePark</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-page">
        <div class="form-box">
            <div class="form-logo">
                <div class="form-logo-placeholder">LOGO</div>
                <h1>Safe<span>Park</span></h1>
            </div>
            <p class="form-subtitle">Inicia sesion para explorar areas verdes seguras</p>
            <form action="../Home/index.html">
                <div class="form-group">
                    <label class="form-label">Correo electronico</label>
                    <input class="form-input" type="email" placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Contrasena</label>
                    <input class="form-input" type="password" placeholder="........">
                </div>
                <button class="btn-primary" type="submit">Iniciar sesion</button>
            </form>
            <div class="form-footer">
                No tienes cuenta? <a href="../Registro/index.html">Registrate aqui</a>
            </div>
        </div>
    </div>
    <script src="../Javascript/archivo.js"></script>
</body>
</html>
