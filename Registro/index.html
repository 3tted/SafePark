<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SafePark</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-page">
        <div class="form-box">
            <div class="form-logo">
                <img src="../Assets/logo.png" height="100" alt="SafePark logo">
                <h1>Safe<span>Park</span></h1>
            </div>
            <p class="form-subtitle">Crea tu cuenta y comienza a explorar</p>
            <form action="../Home/index.html">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Nombre</label>
                        <input class="form-input" type="text" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Usuario</label>
                        <input class="form-input" type="text" placeholder="@usuario">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Correo electronico</label>
                    <input class="form-input" type="email" placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Ciudad</label>
                    <input class="form-input" type="text" placeholder="Ciudad Juarez, Chih.">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Contrasena</label>
                        <input class="form-input" type="password" placeholder="........">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmar</label>
                        <input class="form-input" type="password" placeholder="........">
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="terminos">
                    <label for="terminos">Acepto los terminos y condiciones</label>
                </div>
                <button class="btn-primary" type="submit">Crear cuenta</button>
            </form>
            <div class="form-footer">
                Ya tienes cuenta? <a href="../Login/index.html">Inicia sesion</a>
            </div>
        </div>
    </div>
    <script src="../Javascript/archivo.js"></script>
</body>
</html>
