<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — SafePark</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="form-page">
    <div class="form-box">

      <div class="form-logo">
        <div class="form-logo-placeholder">LOGO</div>
        <h1>Safe<span>Park</span></h1>
      </div>
      <p class="form-subtitle">Crea tu cuenta y comienza a explorar</p>

      <form action="home.html">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Nombre</label>
            <input class="form-input" type="text" placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label class="form-label">Usuario</label>
            <input class="form-input" type="text" placeholder="@usuario">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input class="form-input" type="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label">Ciudad</label>
          <input class="form-input" type="text" placeholder="Ciudad Juárez, Chih.">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input class="form-input" type="password" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar contraseña</label>
            <input class="form-input" type="password" placeholder="••••••••">
          </div>
        </div>
        <div class="form-check">
          <input type="checkbox" id="terminos">
          <label for="terminos">Acepto los términos y condiciones de SafePark</label>
        </div>
        <button class="btn-primary" type="submit">Crear cuenta</button>
      </form>

      <div class="form-footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>

    </div>
  </div>

</body>
</html>
